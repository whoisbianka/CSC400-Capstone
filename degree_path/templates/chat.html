{% extends 'base.html' %}
{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/guided-chat.css', v='sidebar-2') }}">
<script src="{{ url_for('static', filename='js/chat-api.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/guided-chat.js', v='sidebar-2') }}" defer></script>
{% endblock %}
{% block content %}
<section id="guided-chat" class="advisor-workspace" aria-labelledby="page-title"
         data-csrf="{{ csrf_token }}" data-explore-url="{{ url_for('web.explore') }}" data-major-url="{{ url_for('web.major_details', cipcode=0) }}">
  <aside id="recommendationsPanel" class="recommendations-sidebar" aria-labelledby="recommendationsTitle">
    <h2 id="recommendationsTitle">Recommended majors</h2>
    <div id="recommendationCards" aria-live="polite"><p class="recommendations-empty">Your recommendations will appear as we learn about your interests.</p></div>
  </aside>
  <div class="chat-container">
    <h1 id="page-title">Chat</h1>
    <div id="chatMessages" class="chat-messages" tabindex="0" role="log" aria-label="Conversation" aria-live="polite" aria-busy="true"></div>
    <div class="chat-input">
      <label for="userInput" class="sr-only">Your message</label>
      <input type="text" id="userInput" placeholder="Tell me about your interests…" autocomplete="off" maxlength="4000" disabled>
      <button id="sendButton" type="button" disabled>Send</button>
    </div>
    <p id="chatStatus" class="chat-note" role="status" aria-live="polite">Loading your chat…</p>
    <p id="chatStorageNote" class="chat-note"></p>
    <button id="reloadChat" type="button" hidden>Reload chat</button>
    <noscript><p>Enable JavaScript to use the chatbot.</p></noscript>
  </div>
</section>
{% endblock %}
