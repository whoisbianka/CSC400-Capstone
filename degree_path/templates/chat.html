{% extends 'base.html' %}
{% block body_class %}advisor-page{% endblock %}
{% block extra_head %}
<script src="{{ url_for('static', filename='js/chat-api.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/guided-chat.js') }}" defer></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
{% endblock %}
{% block content %}
<div class="chat-workspace" id="guided-chat" data-csrf="{{ csrf_token }}" data-explore-url="{{ url_for('web.explore') }}">
  <aside id="recommendationsPanel" aria-labelledby="recommendationsTitle" hidden>
    <h2 id="recommendationsTitle">Recommendations</h2>
    <div id="recommendationCards"></div>
  </aside>
  <div class="chat-main">
  <div class="conversation-body">
    <h1 id="page-title" class="sr-only">Chat</h1>
    <div id="chatMessages" role="log" aria-live="polite" aria-label="Conversation" aria-busy="true"></div>
  </div>
  <div class="composer-dock">
    <div class="composer">
      <label for="userInput" class="sr-only">Your message</label>
      <textarea id="userInput" maxlength="4000" rows="2" placeholder="Tell me what interests you…" disabled></textarea>
      <div class="composer-footer"><span>Enter to send · Shift+Enter for a new line</span><button id="sendButton" class="primary-link" type="button" disabled>Send ↑</button></div>
    </div>
    <p id="chatStatus" role="status" aria-live="polite">Loading your chat…</p>
    <p id="chatStorageNote" hidden></p>
    <button id="reloadChat" class="secondary-button" type="button" hidden>Reload chat</button>
    <button id="resetAdvisorChat" class="secondary-button" type="button" disabled>Reset chat and recommendations</button>
  </div>

  </div>
  <noscript><p>Enable JavaScript to use the chatbot.</p></noscript>
</div>
{% endblock %}
