{% extends "base.html" %}
{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
<script src="{{ url_for('static', filename='js/clerk-config.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/start-auth.js') }}" defer></script>
{% endblock %}
{% block content %}
<div class="page-workspace"><section class="workspace-page" aria-labelledby="page-title" id="start-choice" data-destination="{{ destination_url }}">
  <p class="eyebrow">{{ destination_label }}</p>
  <h1 id="page-title">How would you like to continue?</h1>
  <div class="account-actions">
    <button id="auth-start" type="button">Sign in / Create account</button>
    <a class="primary-link" href="{{ destination_url }}">Continue without logging in →</a>
  </div>
  <p id="auth-status" role="status" aria-live="polite" hidden></p>
  
  <div class="account-actions"><button id="auth-retry" type="button" hidden>Try again</button></div>
</section></div>
<!-- this was made so that users always have the choice to sign in or continue without logging in no matter what feature they choose-->
{% endblock %}
