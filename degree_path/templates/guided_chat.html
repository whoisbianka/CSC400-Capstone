<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find my path | Degree Path</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/guided-chat.css') }}">
  <script src="{{ url_for('static', filename='js/guided-chat.js') }}" defer></script>
</head>
<body class="guided-page">
  {% include '_navigation.html' %}
  <!-- Keep the existing IDs and data attributes used by the chatbot script. -->
  <main class="guided-center">
    <section id="guided-chat" aria-labelledby="page-title" data-recommendations-url="{{ url_for('web.recommendations_api') }}" data-explore-url="{{ url_for('web.explore') }}" data-csrf="{{ csrf_token }}">
      <div class="chat-container">
        <h1 id="page-title">Find my path</h1>
        <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="Conversation">
          <div class="bot-message"><strong>Degree Path Explorer:</strong><br>Hi! I'm here to help you explore possible college majors, careers, and schools.</div>
          <div class="bot-message"><strong>Degree Path Explorer:</strong><br>Let's start simple. What's your first name?</div>
        </div>
        <div class="chat-input">
          <label for="userInput" class="sr-only">Your answer</label>
          <input type="text" id="userInput" placeholder="Type your message…" autocomplete="off">
          <button id="sendButton" type="button">Send</button>
        </div>
        <p class="chat-note">Answers reset when you reload.</p>
      </div>
    </section>
  </main>
</body>
</html>
