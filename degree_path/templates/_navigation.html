<!-- The shared sticky header keeps navigation and account actions available on every page. -->
<header class="site-navigation" id="account-navigation" data-user-id="{{ session.get('user_id', '') }}" data-csrf="{{ csrf_token }}" data-clerk-key="{{ clerk_publishable_key }}">
  <a class="site-brand" href="{{ url_for('web.home') }}"><span aria-hidden="true">✳</span> Degree Path</a>
  <nav aria-label="Account navigation">
    <a href="{{ url_for('web.explore') }}" {% if request.endpoint in ['web.explore', 'web.program_details'] %}aria-current="page"{% endif %}>Explore</a>
    <a href="{{ url_for('web.saved_majors_page') }}" {% if request.endpoint == 'web.saved_majors_page' %}aria-current="page"{% endif %}>Saved majors</a>
    <a href="{{ url_for('web.compare') }}" {% if request.endpoint == 'web.compare' %}aria-current="page"{% endif %}>Compare</a>
    <a href="{{ url_for('web.profile') }}" {% if request.endpoint == 'web.profile' %}aria-current="page"{% endif %}>Profile</a>
    <a href="{{ url_for('web.settings') }}" {% if request.endpoint == 'web.settings' %}aria-current="page"{% endif %}>Settings</a>
    <button type="button" class="nav-auth-button" data-auth-action="{{ 'logout' if session.get('user_id') else 'login' }}">{{ 'Sign out' if session.get('user_id') else 'Sign in' }}</button>
  </nav>
</header>

<p id="account-status" class="account-status" role="status" hidden></p>
<button id="account-retry-logout" type="button" hidden>Finish signing out</button>
<button id="saved-major-signin" type="button" data-auth-action="login" hidden>Sign in</button>
<script src="{{ url_for('static', filename='js/account-auth.js', v='account-profile-1') }}" defer></script>
